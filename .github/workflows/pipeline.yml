name: pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
      - "scripts/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      repo-slug:
        description: "Repo slug (es. il-nome-del-repo)"
        required: true
        type: string
      sync-pattern:
        description: "flat o per-dataset"
        default: "per-dataset"
        type: string

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: Support seeds
        run: make seeds

      - name: Run datasets
        run: make run

      # ── GCS auth + sync ─────────────────────────────────────────────
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync to GCS (per-dataset)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'per-dataset'
        run: |
          for slug_dir in out/data/clean/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            year=$(ls "$slug_dir" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No clean output for $slug" && continue
            gsutil -m rsync -r "${slug_dir}${year}/" "gs://dataciviclab-clean/${{ inputs.repo-slug }}/$slug/$year/"
            echo "✅ $slug clean synced"
          done
          for slug_dir in out/data/mart/*/; do
            [ -d "$slug_dir" ] || continue
            slug=$(basename "$slug_dir")
            year=$(ls "$slug_dir" 2>/dev/null | sort -rn | head -1)
            [ -z "$year" ] && echo "⚠️  No mart output for $slug" && continue
            gsutil -m rsync -r "${slug_dir}${year}/" "gs://dataciviclab-mart/${{ inputs.repo-slug }}/$slug/$year/"
            echo "✅ $slug mart synced"
          done

      - name: Sync to GCS (flat)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && inputs.sync-pattern == 'flat'
        run: |
          gsutil -m rsync -r out/data/mart/ gs://dataciviclab-mart/${{ inputs.repo-slug }}/
          gsutil -m rsync -r out/data/clean/ gs://dataciviclab-clean/${{ inputs.repo-slug }}/
          echo "✅ Synced to gs://dataciviclab-mart|clean/${{ inputs.repo-slug }}/"

      # ── Registry → draft PR ──────────────────────────────────────────
      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          prefix: "${{ inputs.repo-slug }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
