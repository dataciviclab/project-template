# DEMO dataset — da sostituire/rimuovere quando si avvia un dataset reale.
# Serve a mostrare la struttura minima di un dataset in questo repo:
#   datasets/<slug>/dataset.yml  → contratto
#   datasets/<slug>/sql/clean.sql → trasformazione RAW → CLEAN
#   datasets/<slug>/sql/mart_*.sql → mart derivati
# root: path relativo alla dir di QUESTO file (datasets/<slug>/), verso out/
root: "../../out"
schema_version: 1

dataset:
  name: "demo_saldi_stato"
  source_id: "mef_bdap"
  tags: [demo, finanza-pubblica, saldi]
  category: finanza-pubblica
  description: "Demo — saldi di finanza pubblica (BDAP) usato come esempio di struttura."
  years: [2022]

raw:
  output_policy: "versioned"
  sources:
    - name: "bdap_csv"
      type: "http_file"
      args:
        url: "https://bdap-opendata.rgs.mef.gov.it/export/csv/Rendiconto-Pubblicato---Serie-storica---Saldi.csv"
        filename: "bdap_rendiconto_saldi_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read_mode: "fallback"
  read:
    source: "config_only"
    mode: "explicit"
    include:
      - "bdap_rendiconto_saldi_*.csv"
    delim: ";"
    decimal: "."
    encoding: "utf-8"
    header: true
    columns: null
  required_columns:
    - "anno"
    - "saldo_netto"
    - "indebitamento_netto"
    - "avanzo_primario"
    - "entrate_finali"
    - "spese_finali"
  validate:
    primary_key:
      - "anno"
    not_null:
      - "anno"
    min_rows: 1

mart:
  tables:
    - name: "mart_ok"
      sql: "sql/mart_ok.sql"
  required_tables:
    - "mart_ok"
  validate:
    table_rules:
      mart_ok:
        required_columns:
          - "anno"
          - "saldo_netto"
          - "entrate_finali"
          - "spese_finali"
        primary_key:
          - "anno"
        not_null:
          - "anno"
        min_rows: 1

validation:
  fail_on_error: true

output:
  artifacts: "minimal"
  legacy_aliases: true
